<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArenaStats Complete</title>
  <meta name="theme-color" content="#0b0b0f" />
</head>
<body>
<script>
const STORAGE_KEY = 'arena_stats_stable_v3';
const OLD_STORAGE_KEYS = ['arena_stats_stable_v2', 'arena_stats_stable_v1'];
const RANK_FORMATS = ['スタンダード', 'アルケミー', 'ヒストリック', 'パイオニア', 'タイムレス'];
let lastRankFormat = localStorage.getItem('arena_stats_last_rank_format') || 'スタンダード';

function saveState(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('save failed', e);
  }
}

function loadState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      for (const key of OLD_STORAGE_KEYS) {
        raw = localStorage.getItem(key);
        if (raw) break;
      }
    }
    if (!raw) return { selectedDeckId: null, decks: [] };
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.decks)) return { selectedDeckId: null, decks: [] };
    parsed.decks.forEach(deck => {
      if (!Array.isArray(deck.matches)) deck.matches = [];
      deck.matches.forEach(match => {
        if (!match.rankFormat) match.rankFormat = normalizeRankFormat(deck.format);
      });
    });
    saveState(parsed);
    return parsed;
  } catch (e) {
    console.error('load failed', e);
    return { selectedDeckId: null, decks: [] };
  }
}

let state = loadState();

function uid() {
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function normalizeRankFormat(value) {
  if (!value) return '未設定';
  const v = String(value).trim().toLowerCase();
  if (v.includes('standard') || v.includes('スタンダード')) return 'スタンダード';
  if (v.includes('alchemy') || v.includes('アルケミー')) return 'アルケミー';
  if (v.includes('historic') || v.includes('ヒストリック')) return 'ヒストリック';
  if (v.includes('pioneer') || v.includes('パイオニア') || v.includes('explorer') || v.includes('エクスプローラー')) return 'パイオニア';
  if (v.includes('timeless') || v.includes('タイムレス')) return 'タイムレス';
  return '未設定';
}

function getSelectedDeck() {
  return state.decks.find(d => d.id === state.selectedDeckId) || null;
}

function calcStats(matches) {
  const wins = matches.filter(m => m.result === 'win').length;
  const losses = matches.filter(m => m.result === 'loss').length;
  const total = wins + losses;
  return { wins, losses, total, rate: total ? Math.round((wins / total) * 100) : 0 };
}

function calcGlobal() {
  const allMatches = state.decks.flatMap(d => Array.isArray(d.matches) ? d.matches : []);
  return calcStats(allMatches);
}

function calcByRankFormat(matches) {
  const rows = [];
  for (const format of RANK_FORMATS) {
    const list = matches.filter(m => (m.rankFormat || '未設定') === format);
    rows.push({ format, ...calcStats(list) });
  }
  const unset = matches.filter(m => !RANK_FORMATS.includes(m.rankFormat || '未設定'));
  if (unset.length) rows.push({ format: '未設定', ...calcStats(unset) });
  return rows;
}

function ensureState() {
  if (!state.selectedDeckId && state.decks[0]) state.selectedDeckId = state.decks[0].id;
}

function persistAndRender() {
  ensureState();
  saveState(state);
  render();
}

function addDeck() {
  const name = prompt('デッキ名を入力してください');
  if (!name || !name.trim()) return;
  const format = prompt('フォーマットを入力してください', 'スタンダード') || 'スタンダード';
  const archetype = prompt('アーキタイプを入力してください', '') || '';
  const deck = { id: uid(), name: name.trim(), format: normalizeRankFormat(format), archetype: archetype.trim(), matches: [] };
  state.decks.unshift(deck);
  state.selectedDeckId = deck.id;
  persistAndRender();
}

function selectDeck(id) {
  state.selectedDeckId = id;
  persistAndRender();
}

function renameDeck() {
  const deck = getSelectedDeck();
  if (!deck) return;
  const name = prompt('新しいデッキ名', deck.name);
  if (!name || !name.trim()) return;
  const format = prompt('フォーマット', deck.format || 'スタンダード');
  const archetype = prompt('アーキタイプ', deck.archetype || '');
  deck.name = name.trim();
  deck.format = normalizeRankFormat(format || 'スタンダード');
  deck.archetype = (archetype || '').trim();
  persistAndRender();
}

function deleteDeck() {
  const deck = getSelectedDeck();
  if (!deck) return;
  if (!confirm('デッキ「' + deck.name + '」を削除しますか？')) return;
  state.decks = state.decks.filter(d => d.id !== deck.id);
  state.selectedDeckId = state.decks[0] ? state.decks[0].id : null;
  persistAndRender();
}

function addMatch() {
  const deck = getSelectedDeck();
  if (!deck) {
    alert('先にデッキを追加してください');
    return;
  }
  openMatchForm();
}

function openMatchForm() {
  const deck = getSelectedDeck();
  const defaultFormat = RANK_FORMATS.includes(lastRankFormat) ? lastRankFormat : (deck ? normalizeRankFormat(deck.format) : 'スタンダード');
  const options = RANK_FORMATS.map(f => `<option value="${f}" ${f === defaultFormat ? 'selected' : ''}>${f}</option>`).join('');
  const modal = document.createElement('div');
  modal.id = 'matchModal';
  modal.style.position = 'fixed';
  modal.style.inset = '0';
  modal.style.background = 'rgba(0,0,0,.72)';
  modal.style.display = 'grid';
  modal.style.placeItems = 'center';
  modal.style.zIndex = '9999';
  modal.innerHTML = `
    <div style="width:min(520px,calc(100vw - 24px));background:#ffffff;color:#111827;border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);">
      <h2 style="margin:0 0 14px;color:#111827;">対戦結果を追加</h2>
      <label style="font-size:13px;font-weight:bold;color:#374151;">結果</label>
      <select id="form_result" style="width:100%;margin:6px 0 12px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;">
        <option value="win">勝ち / Win</option>
        <option value="loss">負け / Loss</option>
      </select>

      <label style="font-size:13px;font-weight:bold;color:#374151;">ランク戦フォーマット</label>
      <select id="form_rank_format" style="width:100%;margin:6px 0 12px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;">
        ${options}
      </select>

      <label style="font-size:13px;font-weight:bold;color:#374151;">Bo形式</label>
      <select id="form_bo" style="width:100%;margin:6px 0 12px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;">
        <option value="false">Bo1</option>
        <option value="true">Bo3</option>
      </select>

      <label style="font-size:13px;font-weight:bold;color:#374151;">相手アーキタイプ</label>
      <input id="form_opponent" placeholder="例: Mono Red" style="width:100%;margin:6px 0 12px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;" />

      <label style="font-size:13px;font-weight:bold;color:#374151;">先手/後手</label>
      <select id="form_first" style="width:100%;margin:6px 0 12px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;">
        <option value="true">先手</option>
        <option value="false">後手</option>
      </select>

      <label style="font-size:13px;font-weight:bold;color:#374151;">メモ</label>
      <textarea id="form_notes" placeholder="任意" style="width:100%;min-height:80px;margin:6px 0 16px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;"></textarea>

      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button onclick="closeMatchForm()" style="background:#e5e7eb;color:#111827;border:none;padding:10px 14px;border-radius:12px;font-weight:bold;">キャンセル</button>
        <button onclick="saveMatchFromForm()" style="background:#2563eb;color:#fff;border:none;padding:10px 14px;border-radius:12px;font-weight:bold;">追加</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function closeMatchForm() {
  const modal = document.getElementById('matchModal');
  if (modal) modal.remove();
}

function saveMatchFromForm() {
  const deck = getSelectedDeck();
  if (!deck) return;
  const rankFormat = document.getElementById('form_rank_format').value;
  lastRankFormat = rankFormat;
  localStorage.setItem('arena_stats_last_rank_format', rankFormat);
  deck.matches.unshift({
    id: uid(),
    date: new Date().toISOString(),
    result: document.getElementById('form_result').value,
    rankFormat,
    eventType: rankFormat,
    isBo3: document.getElementById('form_bo').value === 'true',
    opponent: document.getElementById('form_opponent').value.trim(),
    wentFirst: document.getElementById('form_first').value === 'true',
    notes: document.getElementById('form_notes').value.trim()
  });
  closeMatchForm();
  persistAndRender();
}

function deleteMatch(id) {
  const deck = getSelectedDeck();
  if (!deck) return;
  if (!confirm('この対戦結果を削除しますか？')) return;
  deck.matches = deck.matches.filter(m => m.id !== id);
  persistAndRender();
}

function renderRankBreakdown(matches) {
  const rows = calcByRankFormat(matches);
  return `
    <div style="display:grid;gap:8px;margin-top:10px;">
      ${rows.map(r => `
        <div style="display:grid;grid-template-columns:1fr 72px 96px;gap:8px;align-items:center;background:#0f172a;border:1px solid #475569;border-radius:10px;padding:8px;color:#ffffff;">
          <div style="font-weight:bold;color:#ffffff;">${escapeHtml(r.format)}</div>
          <div style="font-weight:900;color:#ffffff;text-align:right;">${r.rate}%</div>
          <div style="font-size:12px;color:#e5e7eb;text-align:right;">${r.wins}勝${r.losses}敗</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderDeckList() {
  return state.decks.map(deck => {
    const s = calcStats(deck.matches);
    const active = deck.id === state.selectedDeckId;
    return `
      <button onclick="selectDeck('${deck.id}')" style="width:100%;text-align:left;padding:12px;border-radius:14px;border:1px solid ${active ? '#93c5fd' : '#475569'};background:${active ? '#1d4ed8' : '#1e293b'};color:#ffffff;margin-bottom:10px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22);">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
          <strong style="color:#ffffff;">${escapeHtml(deck.name)}</strong>
          <strong style="color:#ffffff;font-size:18px;">${s.rate}%</strong>
        </div>
        <div style="font-size:12px;color:#e5e7eb;margin-top:6px;">${escapeHtml(deck.archetype || 'Archetype未設定')} • ${escapeHtml(deck.format || 'スタンダード')} • ${s.wins}勝 ${s.losses}敗</div>
      </button>
    `;
  }).join('');
}

function renderMatches(deck) {
  if (!deck.matches.length) return '<div style="color:#ffffff;background:#334155;padding:12px;border-radius:12px;">まだ対戦履歴がありません</div>';
  return deck.matches.map(m => `
    <div style="border:1px solid #475569;border-radius:14px;padding:12px;background:#1e293b;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;color:#ffffff;">
      <div>
        <div style="font-weight:900;color:${m.result === 'win' ? '#86efac' : '#fca5a5'};">${m.result === 'win' ? 'WIN' : 'LOSS'}</div>
        <div style="color:#ffffff;">${escapeHtml(m.rankFormat || '未設定')} • ${m.isBo3 ? 'Bo3' : 'Bo1'}</div>
        <div style="font-size:12px;color:#e5e7eb;">相手: ${escapeHtml(m.opponent || 'Unknown')} / ${m.wentFirst ? '先手' : '後手'}</div>
        <div style="font-size:12px;color:#e5e7eb;">${new Date(m.date).toLocaleString()}</div>
        ${m.notes ? `<div style="font-size:12px;color:#ffffff;margin-top:4px;">${escapeHtml(m.notes)}</div>` : ''}
      </div>
      <button onclick="deleteMatch('${m.id}')" style="background:#dc2626;border:none;color:white;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:bold;">削除</button>
    </div>
  `).join('');
}

function render() {
  ensureState();
  const global = calcGlobal();
  const allMatches = state.decks.flatMap(d => Array.isArray(d.matches) ? d.matches : []);
  const deck = getSelectedDeck();
  const deckStats = deck ? calcStats(deck.matches) : { wins: 0, losses: 0, total: 0, rate: 0 };

  document.body.innerHTML = `
    <div style="display:grid;grid-template-columns:340px 1fr;min-height:100vh;background:#0f172a;color:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      <aside style="padding:16px;border-right:1px solid #334155;background:#111827;color:#ffffff;overflow:auto;">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div>
            <div style="font-size:24px;font-weight:900;color:#ffffff;">ArenaStats</div>
            <div style="font-size:12px;color:#e5e7eb;">安定版 / 複数デッキ対応</div>
          </div>
          <button onclick="addDeck()" style="background:#2563eb;border:none;color:white;padding:10px 12px;border-radius:12px;font-weight:bold;cursor:pointer;">＋ デッキ</button>
        </div>

        <div style="margin-top:14px;padding:14px;border:1px solid #93c5fd;background:#1d4ed8;border-radius:14px;color:#ffffff;box-shadow:0 8px 24px rgba(0,0,0,.28);">
          <div style="font-size:13px;color:#dbeafe;font-weight:bold;">全デッキ通算勝率</div>
          <div style="font-size:34px;font-weight:1000;margin-top:4px;color:#ffffff;">${global.rate}%</div>
          <div style="font-size:13px;color:#ffffff;">${global.wins}勝 ${global.losses}敗 / ${global.total}戦</div>
          <div style="margin-top:10px;font-size:13px;font-weight:bold;color:#dbeafe;">ランク戦別明細</div>
          ${renderRankBreakdown(allMatches)}
        </div>

        <div style="margin-top:14px;">
          ${renderDeckList() || '<div style="color:#ffffff;background:#334155;padding:12px;border-radius:12px;">まだデッキがありません</div>'}
        </div>
      </aside>

      <main style="padding:16px;background:#0f172a;color:#ffffff;overflow:auto;">
        ${deck ? `
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;">
            <div>
              <div style="font-size:28px;font-weight:900;color:#ffffff;">${escapeHtml(deck.name)}</div>
              <div style="font-size:13px;color:#e5e7eb;">${escapeHtml(deck.archetype || 'Archetype未設定')} • ${escapeHtml(deck.format || 'スタンダード')}</div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button onclick="addMatch()" style="background:#2563eb;border:none;color:white;padding:10px 12px;border-radius:12px;font-weight:bold;cursor:pointer;">＋ 対戦追加</button>
              <button onclick="renameDeck()" style="background:#334155;border:1px solid #64748b;color:white;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:bold;">デッキ編集</button>
              <button onclick="deleteDeck()" style="background:#991b1b;border:1px solid #ef4444;color:white;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:bold;">デッキ削除</button>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">
            <section style="border:1px solid #60a5fa;background:#1d4ed8;border-radius:18px;padding:16px;color:#ffffff;box-shadow:0 8px 24px rgba(0,0,0,.28);">
              <h3 style="margin:0 0 12px;color:#ffffff;">デッキ勝率</h3>
              <div style="font-size:48px;font-weight:1000;line-height:1;color:#ffffff;">${deckStats.rate}%</div>
              <div style="color:#ffffff;margin-top:6px;">${deckStats.wins}勝 ${deckStats.losses}敗 / ${deckStats.total}戦</div>
              <div style="margin-top:12px;font-size:13px;font-weight:bold;color:#dbeafe;">ランク戦別明細</div>
              ${renderRankBreakdown(deck.matches)}
            </section>
            <section style="border:1px solid #475569;background:#1e293b;border-radius:18px;padding:16px;color:#ffffff;box-shadow:0 8px 24px rgba(0,0,0,.28);">
              <h3 style="margin:0 0 12px;color:#ffffff;">内訳</h3>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div style="background:#334155;border:1px solid #64748b;border-radius:12px;padding:12px;color:#ffffff;"><div style="font-size:12px;color:#e5e7eb;">総勝利</div><div style="font-size:24px;font-weight:900;color:#ffffff;">${deckStats.wins}</div></div>
                <div style="background:#334155;border:1px solid #64748b;border-radius:12px;padding:12px;color:#ffffff;"><div style="font-size:12px;color:#e5e7eb;">総敗北</div><div style="font-size:24px;font-weight:900;color:#ffffff;">${deckStats.losses}</div></div>
              </div>
            </section>
          </div>

          <section style="border:1px solid #475569;background:#1e293b;border-radius:18px;padding:16px;margin-top:14px;color:#ffffff;box-shadow:0 8px 24px rgba(0,0,0,.28);">
            <h3 style="margin:0 0 12px;color:#ffffff;">対戦履歴</h3>
            ${renderMatches(deck)}
          </section>
        ` : `
          <div style="display:grid;place-items:center;min-height:70vh;color:#ffffff;text-align:center;">
            <div style="background:#1e293b;border:1px solid #475569;border-radius:18px;padding:24px;color:#ffffff;">
              <h2 style="color:#ffffff;">デッキを追加してください</h2>
              <p style="color:#e5e7eb;">複数デッキを管理でき、再読み込み後もデータは保持されます。</p>
              <button onclick="addDeck()" style="background:#2563eb;border:none;color:white;padding:10px 12px;border-radius:12px;font-weight:bold;cursor:pointer;">最初のデッキを追加</button>
            </div>
          </div>
        `}
      </main>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

window.addEventListener('beforeunload', () => saveState(state));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveState(state);
});

ensureState();
saveState(state);
render();
</script>
</body>
</html>
