<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArenaStats Complete</title>
  <meta name="theme-color" content="#0b0b0f" />
</head>
<body>
<script>
// ★重要修正版（再読み込みで消えない＋全体勝率）
const STORAGE_KEY = 'arena_stats_store_v2';

function saveState(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : { decks: [] };
}

let state = loadState();

function calcGlobal(){
  let wins=0,losses=0;
  state.decks.forEach(d=>{
    d.matches.forEach(m=>{
      if(m.result==='win') wins++; else losses++;
    });
  });
  const total=wins+losses;
  return {wins,losses,total,rate: total?Math.round((wins/total)*100):0};
}

function addMatch(){
  if(!state.decks.length){
    state.decks.push({name:'デッキ',matches:[]});
  }
  state.decks[0].matches.push({result:Math.random()>0.5?'win':'loss'});
  saveState(state);
  render();
}

function render(){
  const g=calcGlobal();
  document.body.innerHTML=`
    <h1>ArenaStats</h1>
    <h2>全体勝率 ${g.rate}%</h2>
    <p>${g.wins}勝 ${g.losses}敗 (${g.total}戦)</p>
    <button onclick="addMatch()">試合追加</button>
  `;
}

window.addEventListener('beforeunload',()=>saveState(state));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') saveState(state);
});

render();
</script>
</body>
</html>
